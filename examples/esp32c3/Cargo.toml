[package]
name = "esp32-c3"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
esp-backtrace = { version = "0.17.0", features = [
    "esp32c3",
    "panic-handler",
    "exception-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32c3"] }
# The `esp32c3` feature enables `portable-atomic/unsafe-assume-single-core`,
# providing us with the atomics required for RTIC.
esp-hal = { version = "=1.0.0-rc.0", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.15.0", features = ["esp32c3"] }
esp32c3 = { version = "0.31.0", features = ["critical-section"] }
rtic = { path = "../../rtic/", features = ["riscv-esp32c3-backend"] }
rtic-monotonics = { path = "../../rtic-monotonics/", features = ["esp32c3-systimer"] }
