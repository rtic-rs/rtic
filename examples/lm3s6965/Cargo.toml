[package]
name = "rtic_lm3s6965"
categories = ["embedded", "no-std"]
description = "Examples of RTIC apps for the lm3s6965 chip"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
heapless = "0.8.0"
lm3s6965 = "0.2"
cortex-m = { version = "0.7.0", features = ["critical-section-single-core"] }
cortex-m-semihosting = "0.5.0"
rtic-time = { path = "../../rtic-time" }
rtic-sync = { path = "../../rtic-sync" }
rtic-common = { path = "../../rtic-common" }
rtic-monotonics = { path = "../../rtic-monotonics", features = ["cortex-m-systick"] }
cfg-if = "1.0"

# Activate `rtic` with the correct backend depending on the target architecture.

[target.thumbv6m-none-eabi.dependencies]
rtic = { path = "../../rtic", features = ["thumbv6-backend"] }
# Enable portable-atomic/critical-section, as thumbv6 doesn't have
# built-in CAS atomics.
portable-atomic = { version = "1.13", features = ["critical-section"] }

[target.thumbv7m-none-eabi.dependencies]
rtic = { path = "../../rtic", features = ["thumbv7-backend"] }

[target.'thumbv8m.base-none-eabi'.dependencies]
rtic = { path = "../../rtic", features = ["thumbv8base-backend"] }

[target.'thumbv8m.main-none-eabi'.dependencies]
rtic = { path = "../../rtic", features = ["thumbv8main-backend"] }
portable-atomic = { version = "1.13", features = ["critical-section"] }

[dependencies.futures]
version = "0.3.26"
default-features = false
features = ["async-await"]

[dependencies.panic-semihosting]
features = ["exit"]
version = "0.6.0"
