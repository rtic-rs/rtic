[package]
edition = "2021"
name = "embassy-stm32g4-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies.rtic]
path="../../rtic"
features = ["thumbv7-backend"]

[dependencies.rtic-monotonics]
path="../../rtic-monotonics"
features = ["cortex-m-systick"]

[dependencies.rtic-sync]
path="../../rtic-sync"

[dependencies]
# Change stm32u575zi to your chip name, if necessary. Also change .cargo/config.toml
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "time-driver-any", "stm32u575zi", "unstable-pac", "exti"]  }

defmt = "1.1.1"
defmt-rtt = "1.3.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
